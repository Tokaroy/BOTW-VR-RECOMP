name: Bug report
description: Something in the game looks, sounds or behaves wrong, stutters, or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Savage Wind! Every report shows how far the game really works.
        **Never attach or link game files, keys, firmware or generated game code**, and no links to copies of the
        game: issues with any of them are removed. Your own save files are welcome: they show us whether a problem
        comes from the game's mechanics.

        Reports without a runtime or startup log, from an older release or from game version 1.8.2 get a `needs-info`
        label, and are closed after 24 hours if nothing changes (you can reopen them any time).

        **Read the [FAQ](https://github.com/Revivedx/SavageWindRecomp/blob/main/docs/FAQ.md) first.** Issues about something it already covers, including its known issues, are
        closed right away with the reason.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I read the [FAQ](https://github.com/Revivedx/SavageWindRecomp/blob/main/docs/FAQ.md) and its known issues. This isn't covered there, or I tried what it says and it didn't help.
          required: true
        - label: I'm on the [latest release](https://github.com/Revivedx/SavageWindRecomp/releases), and the bug still happens there.
          required: true
        - label: I searched the [existing issues](https://github.com/Revivedx/SavageWindRecomp/issues?q=is%3Aissue) and this one isn't reported yet.
          required: true
  - type: dropdown
    id: version
    attributes:
      label: Savage Wind version
      description: Shown on the game's title screen, in Savage Wind Configuration and on the first line of `savagewind.log`.
      options:
        - "0.6.0-alpha.6 (latest)"
        - "Built from the test branch"
        - "An older release (please update and try again first)"
    validations:
      required: true
  - type: dropdown
    id: game_version
    attributes:
      label: Game version
      description: >-
        The update your game files have. 1.9.0, the latest, is the only supported version.
      options:
        - "1.9.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Your PC
      description: Windows version or Linux distribution, GPU and its driver version, CPU.
      placeholder: Windows 11 24H2, RTX 3060 (driver 581.29), Ryzen 5 5600X
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the game
      description: The place, menu, cutscene or quest where it happened.
      placeholder: Great Plateau, Eastern Abbey, at night
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and how to make it happen again
      description: What you expected, what you saw instead, and the steps that lead to it.
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Settings
      description: Frame rate, window size and fullscreen mode, and upscaler (Options > Settings > Video).
      placeholder: 60 fps, 2560x1440 borderless, upscaler Off
  - type: textarea
    id: log
    attributes:
      label: Runtime or startup log
      description: >-
        Drag savagewind.log here if the app opened. If it did not open, attach savagewind-launcher.log instead. On Linux
        these are in ~/.local/share/savagewind/ (or data/ next to a PC Maker AppImage); on Windows they are next to the
        runtime. PC Maker build logs are in ~/Savage Wind VR Maker Logs/ (Windows: your user profile folder). The app's
        Problem report button makes one zip with the runtime and startup logs, settings and shader pipeline list (hashes
        only, so future releases can prepare those pipelines for everyone). Screenshots or a short video help too.
      placeholder: Drag a runtime log, startup log, PC Maker log, or problem report zip here
    validations:
      required: true
  - type: textarea
    id: save
    attributes:
      label: Save file (for crashes and problems with the game's mechanics)
      description: >-
        Optional, and it helps a lot with crashes. Close the game, compress the whole `save` folder into a zip and
        drag it here (GitHub doesn't take folders). On Windows it's next to savagewind.exe; on Linux,
        ~/.local/share/savagewind/save/. If you can, use the last save before the problem.
      placeholder: Drag save.zip here
  - type: checkboxes
    id: legal
    attributes:
      label: Before sending
      options:
        - label: This report contains no game files, keys, firmware, generated game code or links to copies of the game.
          required: true
